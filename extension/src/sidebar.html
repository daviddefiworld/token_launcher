<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Automation</title>
    <style>
      :root {
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        background: #f8fafc;
        margin: 0;
      }

      .shell {
        padding: 18px;
      }

      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }

      .muted {
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        margin-top: 14px;
        padding: 14px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        box-sizing: border-box;
        font: inherit;
        padding: 9px 10px;
        width: 100%;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 10px;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
        margin-top: 10px;
        padding: 10px 12px;
        width: 100%;
      }

      .row {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding: 7px 0;
      }

      code {
        color: #2563eb;
        font-size: 12px;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .verification-panel h2 {
        font-size: 14px;
        margin: 0 0 10px;
      }

      .code-value {
        color: #0f172a;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.12em;
        max-width: none;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Token Automation</h1>
      <p class="muted">Keep this side panel open to receive dashboard orders.</p>

      <section class="panel">
        <label for="backend-url">Backend URL</label>
        <input id="backend-url" type="text" autocomplete="off" />
        <button id="save-backend" type="button">Save and reconnect</button>
      </section>

      <section class="panel">
        <div class="row">
          <span>Connection</span>
          <strong id="connection-status">Disconnected</strong>
        </div>
        <div class="row">
          <span>Extension ID</span>
          <code id="extension-id">...</code>
        </div>
        <div class="row">
          <span>Last order</span>
          <code id="last-order">none</code>
        </div>
      </section>

      <section class="panel verification-panel" id="verification-panel" hidden>
        <h2>Verification codes</h2>
        <div class="row">
          <span>Email code</span>
          <code id="verification-email-code" class="code-value">—</code>
        </div>
        <div class="row">
          <span>Authenticator</span>
          <code id="verification-auth-code" class="code-value">—</code>
        </div>
      </section>

      <section class="panel">
        <p id="message" class="muted">Waiting for orders...</p>
      </section>
    </main>
  </body>
</html>
